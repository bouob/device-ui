name: Build Check

on:
  push:
    branches: ["fix/**", "feature/**"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-heltec-v4-tft:
    name: Build heltec-v4-tft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout device-ui
        uses: actions/checkout@v4
        with:
          path: device-ui

      - name: Checkout meshtastic/firmware
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          path: firmware
          submodules: recursive

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-heltec-v4-tft-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-heltec-v4-tft-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware with local device-ui
        working-directory: firmware
        run: |
          pio run -e heltec-v4-tft \
            --project-option="lib_extra_dirs=${{ github.workspace }}/device-ui"
