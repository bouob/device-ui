name: Build Check

on:
  push:
    branches: ["fix/**", "feature/**"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-heltec-v4-tft:
    name: Build heltec-v4-tft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout device-ui
        uses: actions/checkout@v4
        with:
          path: device-ui

      - name: Checkout meshtastic/firmware
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          path: firmware
          submodules: recursive

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-heltec-v4-tft-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-heltec-v4-tft-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Patch platformio.ini to use local patched device-ui
        working-directory: firmware
        run: |
          DEVICE_UI_PATH="${{ github.workspace }}/device-ui"
          echo "Using local device-ui fork at: $DEVICE_UI_PATH"
          # firmware/platformio.ini references device-ui as a ZIP from the official repo, e.g.:
          #   https://github.com/meshtastic/device-ui/archive/<commit_hash>.zip
          # Replace that URL with our local fork so PlatformIO compiles our patched source.
          sed -i "s|https://github.com/meshtastic/device-ui/archive/[^ ]*\.zip|$DEVICE_UI_PATH|g" platformio.ini
          echo "--- Patched lib_deps entry (device-ui) ---"
          grep -n "device-ui" platformio.ini | head -5

      - name: Build firmware with patched device-ui
        working-directory: firmware
        run: pio run -e heltec-v4-tft

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: firmware-heltec-v4-tft-patched
          path: |
            firmware/.pio/build/heltec-v4-tft/firmware-heltec-v4-tft-*.bin
            firmware/.pio/build/heltec-v4-tft/firmware-heltec-v4-tft-*.elf
            firmware/.pio/build/heltec-v4-tft/littlefs-heltec-v4-tft-*.bin
          retention-days: 7
