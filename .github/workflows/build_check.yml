name: Build Check

on:
  push:
    branches: ["fix/**", "feature/**"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-heltec-v4-tft:
    name: Build heltec-v4-tft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout device-ui
        uses: actions/checkout@v4
        with:
          path: device-ui

      - name: Checkout meshtastic/firmware
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          path: firmware
          submodules: recursive

      - name: Inject patched device-ui into firmware
        run: |
          # PlatformIO lib/ submodule takes priority over PLATFORMIO_LIB_EXTRA_DIRS.
          # Find device-ui inside the firmware checkout by locating ViewController.cpp,
          # then replace its root directory with our patched fork.
          VIEWCTRL=$(find firmware -maxdepth 10 -type f -name "ViewController.cpp" 2>/dev/null | head -1)
          if [ -n "$VIEWCTRL" ]; then
            # ViewController.cpp lives at <root>/source/graphics/common/ViewController.cpp
            UIDIR=$(dirname "$(dirname "$(dirname "$(dirname "$VIEWCTRL")")")")
            echo "Replacing firmware's device-ui at: $UIDIR"
            rsync -av --delete --exclude=".git" device-ui/ "$UIDIR/"
          else
            echo "WARNING: device-ui not found in firmware submodules"
            echo "Falling back to PLATFORMIO_LIB_EXTRA_DIRS (may use stale submodule)"
          fi

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-heltec-v4-tft-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-heltec-v4-tft-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware with local device-ui
        working-directory: firmware
        run: pio run -e heltec-v4-tft

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: firmware-heltec-v4-tft-patched
          path: |
            firmware/.pio/build/heltec-v4-tft/firmware-heltec-v4-tft-*.bin
            firmware/.pio/build/heltec-v4-tft/firmware-heltec-v4-tft-*.elf
            firmware/.pio/build/heltec-v4-tft/littlefs-heltec-v4-tft-*.bin
          retention-days: 7
